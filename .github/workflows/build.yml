name: Build Warp Connect v0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: Warp-Connect-v0.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'Warp-Connect-v0.2*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify dual transport source
        run: |
          set -e
          grep -q 'WarpManager.connect' "$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'startTunnelWithFd' "$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"
          grep -q 'com.wireguard.android:tunnel' "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libgojni.so"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/armeabi-v7a/libgojni.so"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/Warp-Connect-v0.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.2.0-debug
          path: out/Warp-Connect-v0.2.0-debug.apk
          if-no-files-found: error
