name: Build Warp Connect v0.3.5 UI + auto-connect

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Warp Connect v0.3.5 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'Warp-Connect-v0.3.5*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Warp Connect v0.3.5 source ZIP not found in repository root"
            exit 1
          fi
          echo "Using source: $ZIP"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Gradle root: $PROJECT"

      - name: Verify stable v0.3.4 architecture plus v0.3.5 UI/auto-connect
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          BOOT="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/BootReceiver.kt"
          USQUE="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          APPGRADLE="$PROJECT_DIR/app/build.gradle.kts"
          BG="$PROJECT_DIR/app/src/main/res/drawable/tv_background.xml"

          test -f "$MAIN"
          test -f "$BOOT"
          test -f "$USQUE"
          test -f "$BG"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libgojni.so"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/armeabi-v7a/libgojni.so"

          grep -q 'versionName = "0.3.5"' "$APPGRADLE"
          grep -q 'android:process=":masque"' "$MANIFEST"
          grep -q 'android.intent.action.BOOT_COMPLETED' "$MANIFEST"
          grep -q 'prefs.getBoolean("auto_connect", false)' "$BOOT"
          grep -q '!autoConnect && !desiredConnected' "$BOOT"
          grep -q 'WarpManager.connect(context.applicationContext, port)' "$BOOT"
          grep -q 'startForegroundService(serviceIntent)' "$BOOT"
          grep -q 'setBackgroundResource(R.drawable.tv_background)' "$MAIN"
          grep -q 'Auto Connect' "$MAIN"
          grep -q 'prefs.edit().putBoolean("auto_connect", checked)' "$MAIN"
          grep -q '4500   WARP  ·  Recommended' "$MAIN"
          grep -q '2408   WARP  ·  WARP default' "$MAIN"

          # Preserve the proven v0.3.4 tunnel architecture.
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          grep -q 'WarpManager.disconnect(applicationContext)' "$MAIN"
          grep -q 'ACTION_QUERY_STATUS' "$MAIN"
          grep -q 'ACTION_QUERY_STATUS' "$USQUE"
          if grep -q 'MASQUE_TO_WIREGUARD_SETTLE_MS\|isFullyStopped()\|moveTaskToFront(' "$MAIN"; then
            echo "Discarded experimental switching code found"
            exit 1
          fi
          if grep -q 'android.permission.REORDER_TASKS' "$MANIFEST"; then exit 1; fi
          if grep -q 'android:launchMode="singleTask"' "$MANIFEST"; then exit 1; fi
          echo "PASS: v0.3.5 keeps v0.3.4 networking and adds only UI + boot auto-connect control"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Connect-v0.3.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.3.5
          path: out/Warp-Connect-v0.3.5-debug.apk
