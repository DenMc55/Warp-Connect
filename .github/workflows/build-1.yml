name: Warp Connect Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Find and extract Warp Connect source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \( -iname 'Warp-Connect*.zip' -o -iname 'warp-connect*.zip' \) | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No Warp-Connect source ZIP found in repository root."
            echo "Files present:"
            ls -la
            exit 1
          fi

          echo "Using source archive: $ZIP_FILE"
          rm -rf extracted-source
          mkdir -p extracted-source
          unzip -q "$ZIP_FILE" -d extracted-source

          PROJECT_DIR="$(find extracted-source -type f -name 'settings.gradle' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted-source -type f -name 'settings.gradle.kts' -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate Android Gradle project after extraction."
            find extracted-source -maxdepth 3 -type f | sort | head -n 100
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No APK was produced."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK" dist/Warp-Connect-v0.1.0-debug.apk
          sha256sum dist/Warp-Connect-v0.1.0-debug.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload Warp Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.1.0-APK
          path: |
            dist/Warp-Connect-v0.1.0-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
