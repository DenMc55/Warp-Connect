name: Build Warp Connect v0.3.7 TV UI refinement

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Warp Connect v0.3.7 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'Warp-Connect-v0.3.7*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Warp Connect v0.3.7 source ZIP not found in repository root"
            exit 1
          fi
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Gradle root: $PROJECT"

      - name: Verify v0.3.6 stable networking baseline retained
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$MAIN"
          test -f "$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          grep -q 'WarpManager.disconnect(applicationContext)' "$MAIN"
          grep -q 'android:process=":masque"' "$MANIFEST"
          grep -q 'auto_connect' "$MAIN"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png"
          test -f "$PROJECT_DIR/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          echo "PASS: stable networking/process isolation retained; UI/icon assets present"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/Warp-Connect-v0.3.7-debug.apk

      - name: Upload Warp Connect v0.3.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.3.7-debug
          path: out/Warp-Connect-v0.3.7-debug.apk
