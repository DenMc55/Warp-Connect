name: Build Warp Connect v0.3.3 process isolation test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Warp Connect v0.3.3 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'Warp-Connect-v0.3.3*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Warp Connect v0.3.3 source ZIP not found in repository root"
            exit 1
          fi
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Gradle root: $PROJECT"

      - name: Verify clean v0.3.0 isolation experiment
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          USQUE="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          WG="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          test -f "$MAIN"
          test -f "$USQUE"
          test -f "$WG"
          test -f "$PROJECT_DIR/app/libs/usque-classes.jar"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libgojni.so"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/armeabi-v7a/libgojni.so"
          grep -q 'android:process=":masque"' "$MANIFEST"
          grep -q 'class MainActivity : AppCompatActivity()' "$MAIN"
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          grep -q 'WarpManager.disconnect(applicationContext)' "$MAIN"
          grep -q 'ACTION_STATUS' "$MAIN"
          grep -q 'Usqueandroid.register' "$USQUE"
          grep -q 'Usqueandroid.getDefaultEndpoint' "$USQUE"
          if grep -q 'Usqueandroid\.' "$MAIN"; then
            echo "Usque native runtime leaked into main process"
            exit 1
          fi
          if grep -q 'moveTaskToFront(' "$MAIN"; then exit 1; fi
          if grep -q 'android.permission.REORDER_TASKS' "$MANIFEST"; then exit 1; fi
          if grep -q 'android:launchMode="singleTask"' "$MANIFEST"; then exit 1; fi
          echo "PASS: clean v0.3.0 base with isolated Usque process"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/Warp-Connect-v0.3.3-process-isolation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.3.3-process-isolation
          path: out/Warp-Connect-v0.3.3-process-isolation.apk
          if-no-files-found: error
