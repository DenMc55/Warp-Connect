name: Build Warp Connect v1.0.7 Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Warp Connect v1.0.7 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'Warp-Connect-v1.0.7*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Warp Connect v1.0.7 source ZIP not found in repository root"
            exit 1
          fi
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Gradle root: $PROJECT"

      - name: Verify v1.0.4 baseline plus complete app exclusions
        shell: bash
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/app/build.gradle.kts"
          MAIN="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          SETTINGS="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/SettingsActivity.kt"
          EXCLUSIONS="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/ExclusionPreferences.kt"
          WG="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          MASQUE="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"
          BOOT="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/BootReceiver.kt"
          AUTO="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/AutoConnectService.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          PROGUARD="$PROJECT_DIR/app/proguard-rules.pro"

          grep -q 'versionName = "1.0.7"' "$APP"
          grep -q 'versionCode = 107' "$APP"
          grep -q 'isMinifyEnabled = true' "$APP"
          grep -q 'isShrinkResources = true' "$APP"
          grep -q 'arm64-v8a' "$APP"
          grep -q 'armeabi-v7a' "$APP"

          # Stable v1.0.4 tunnel/boot architecture remains in place.
          grep -q 'android:process=":masque"' "$MANIFEST"
          grep -q 'AutoConnectService::class.java' "$BOOT"
          grep -q 'INITIAL_DELAY_MS = 10_000L' "$AUTO"
          grep -q 'MAX_ATTEMPTS = 6' "$AUTO"
          grep -q 'NETWORK_WAIT_TIMEOUT_MS = 90_000L' "$AUTO"
          grep -q 'maybeRestoreWireGuardOnLaunch()' "$MAIN"
          ! grep -R -q 'MasqueAutoConnectService' "$PROJECT_DIR/app/src/main" || { echo 'v1.0.5 MASQUE boot experiment found'; exit 1; }

          # New app-exclusion settings.
          test -f "$SETTINGS"
          test -f "$EXCLUSIONS"
          grep -q 'android:name=".SettingsActivity"' "$MANIFEST"
          grep -q 'CATEGORY_LEANBACK_LAUNCHER' "$SETTINGS"
          ! grep -q 'FLAG_SYSTEM' "$SETTINGS" || { echo 'System-flag filter still present'; exit 1; }
          grep -q 'queryIntentActivities(intent, 0)' "$SETTINGS"
          grep -q 'Selected highlighted apps bypass Warp Connect' "$SETTINGS"
          grep -q 'columnCount = if (isTv) 5 else 4' "$SETTINGS"
          grep -q 'hint = "Search apps"' "$SETTINGS"
          grep -q 'Exclude apps from WARP' "$SETTINGS"
          grep -q 'excluded_apps' "$EXCLUSIONS"

          # Same saved exclusions are applied to both WireGuard and MASQUE.
          grep -q 'ExcludedApplications =' "$WG"
          grep -q 'ExclusionPreferences.get(applicationContext)' "$MAIN"
          grep -q 'putStringArrayListExtra("excludedApps"' "$MAIN"
          grep -q 'addDisallowedApplication(pkg)' "$MASQUE"
          grep -q 'putStringArrayListExtra("excludedApps"' "$BOOT"
          grep -q 'ExclusionPreferences.get(applicationContext)' "$AUTO"

          grep -q 'keep class usqueandroid' "$PROGUARD"
          grep -q 'keep class com.wireguard' "$PROGUARD"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libgojni.so"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/armeabi-v7a/libgojni.so"
          if grep -q 'androidx.work:work-runtime-ktx' "$APP"; then
            echo "Unused WorkManager dependency still present"
            exit 1
          fi
          echo "PASS: v1.0.7 = v1.0.4 stable baseline + complete launchable-app exclusions"

      - name: Prepare permanent release signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets are missing."
            echo "Add SIGNING_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to GitHub repository secrets."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/warp-connect-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build optimized signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify release APK and both ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          ls -lh "$APK"
          mkdir -p out
          cp "$APK" out/Warp-Connect-v1.0.7-release.apk

      - name: Upload Warp Connect v1.0.7 release APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v1.0.7-release
          path: out/Warp-Connect-v1.0.7-release.apk
