name: Build Warp Connect v0.2.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Warp Connect v0.2.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'Warp-Connect-v0.2.1-source*.zip' | head -n1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n1)
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify activity guard and transports
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_ROOT/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          MANIFEST="$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'keepTaskFrontForWireGuard' "$MAIN"
          grep -q 'moveTaskToFront(taskId, 0)' "$MAIN"
          grep -q 'android.permission.REORDER_TASKS' "$MANIFEST"
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          grep -q 'Usqueandroid.startTunnelWithFd' "$PROJECT_ROOT/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p out
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" out/Warp-Connect-v0.2.1-debug.apk

      - name: Upload Warp Connect v0.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.2.1-debug
          path: out/Warp-Connect-v0.2.1-debug.apk
          if-no-files-found: error
