name: Build Warp Connect v0.3.1 MASQUE teardown test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Warp Connect v0.3.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'Warp-Connect-v0.3.1*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Warp Connect v0.3.1 source ZIP not found in repository root"
            exit 1
          fi
          echo "Using source: $ZIP"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found after extraction"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Gradle root: $PROJECT"

      - name: Verify stable WireGuard plus clean MASQUE teardown
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          USQUE="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/UsqueVpnService.kt"
          WG="$PROJECT_DIR/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          test -f "$MAIN"
          test -f "$WG"
          test -f "$USQUE"
          test -f "$PROJECT_DIR/app/libs/usque-classes.jar"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libgojni.so"
          test -f "$PROJECT_DIR/app/src/main/jniLibs/armeabi-v7a/libgojni.so"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/warp_connect_logo.png"
          grep -q 'class MainActivity : AppCompatActivity()' "$MAIN"
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          grep -q 'WarpManager.disconnect(applicationContext)' "$MAIN"
          grep -q 'isFullyStopped()' "$MAIN"
          grep -q 'ACTION_STOP' "$MAIN"
          grep -q 'manualStop.set(true)' "$USQUE"
          grep -q 'restarting.set(false)' "$USQUE"
          grep -q 'Usqueandroid.stopTunnel()' "$USQUE"
          if grep -q 'stopActiveTunnel()' "$MAIN"; then
            echo "Old double-stop MASQUE path still present"
            exit 1
          fi
          if grep -q 'Os.close' "$USQUE"; then
            echo "Java-side detached TUN fd close still present"
            exit 1
          fi
          if grep -q 'moveTaskToFront(' "$MAIN"; then
            echo "Old activity workaround leaked into v0.3.1"
            exit 1
          fi
          if grep -q 'android.permission.REORDER_TASKS' "$MANIFEST"; then
            echo "Old REORDER_TASKS workaround leaked into v0.3.1"
            exit 1
          fi
          if grep -q 'android:launchMode="singleTask"' "$MANIFEST"; then
            echo "Old singleTask workaround leaked into v0.3.1"
            exit 1
          fi
          echo "PASS: stable WireGuard + clean single-path MASQUE teardown present"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" out/Warp-Connect-v0.3.1-masque-teardown-test.apk

      - name: Upload Warp Connect v0.3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Connect-v0.3.1-masque-teardown-test
          path: out/Warp-Connect-v0.3.1-masque-teardown-test.apk
          if-no-files-found: error
